services:
  ainovel:
    # Keep compose local-first until this fork publishes its first GHCR image.
    # Using the upstream ghcr.io/voocel image would silently drop Vietnamese overlays.
    image: ainovel-cli-vi:local
    build:
      context: .
    volumes:
      - ./config:/root/.ainovel
      - ./workspace:/workspace
    stdin_open: true
    tty: true
