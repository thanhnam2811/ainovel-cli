name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf 'Files needing gofmt:\n%s\n' "$files"
            exit 1
          fi

      - name: Installer and fork-boundary syntax check
        if: runner.os == 'Linux'
        run: |
          sh -n scripts/install.sh
          sh -n scripts/check-fork-boundaries.sh

      - name: Fork-boundary check
        if: runner.os == 'Linux'
        run: sh scripts/check-fork-boundaries.sh

      - name: Vet
        env:
          GOWORK: "off"
        run: go vet ./...

      - name: Test
        env:
          GOWORK: "off"
        run: go test -buildvcs=false -count=1 ./...

      - name: Race test critical state paths
        if: runner.os == 'Linux'
        env:
          GOWORK: "off"
        run: go test -race -buildvcs=false -count=1 ./internal/host ./internal/store ./internal/tools
